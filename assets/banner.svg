<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2994A" />
      <stop offset="100%" stop-color="#F2C94C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Supply Chain Connections (Dynamic Aspect) -->
  <g stroke="rgba(56, 239, 125, 0.15)" stroke-width="2" fill="none">
    <path d="M -50 150 Q 300 50 600 150 T 1250 150">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M -50 150 Q 300 50 600 150 T 1250 150;
                M -50 150 Q 300 250 600 150 T 1250 150;
                M -50 150 Q 300 50 600 150 T 1250 150" />
    </path>
    <path d="M -50 200 Q 400 280 800 120 T 1250 200" stroke="rgba(242, 201, 76, 0.15)">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M -50 200 Q 400 280 800 120 T 1250 200;
                M -50 200 Q 400 80 800 220 T 1250 200;
                M -50 200 Q 400 280 800 120 T 1250 200" />
    </path>
  </g>

  <!-- Moving Glow Nodes -->
  <circle cx="200" cy="120" r="6" fill="#38ef7d" opacity="0.6">
    <animate attributeName="cx" values="100;1100;100" dur="15s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;200;100" dur="15s" repeatCount="indefinite" />
  </circle>
  <circle cx="800" cy="180" r="8" fill="#F2C94C" opacity="0.5">
    <animate attributeName="cx" values="1100;100;1100" dur="18s" repeatCount="indefinite" />
    <animate attributeName="cy" values="220;80;220" dur="18s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Agriculture Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Header Text (Foreground - High Z-Index & Clear Contrast) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Category Icon / Tag -->
    <rect x="475" y="40" width="250" height="32" rx="16" fill="url(#accentGrad)" opacity="0.2" />
    <text x="600" y="61" fill="#38ef7d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">🌾 AGTECH &amp; FARM-TO-FORK</text>

    <!-- Main Title -->
    <text x="600" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="1">Awesome Agricultural Supply Chain</text>

    <!-- Subtitle -->
    <text x="600" y="175" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">Curated SaaS Platforms, ERPs, FinTech &amp; Open-Source AgTech Tools 🚜📦🌾</text>

    <!-- Subtext Highlights -->
    <text x="600" y="230" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Traceability • Grain Trading • Farm Management • Logistics • Provenance</text>
  </g>
</svg>
